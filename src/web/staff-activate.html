<header class="topbar"><a class="brand" href="/"><span class="mark">X<span>✦</span></span><span>Trợ lý tuyển sinh <b>X</b><small>KHU VỰC CÁN BỘ</small></span></a><nav><a class="staff-link" href="/staff">Đăng nhập cán bộ</a></nav></header>
<main class="staff-main"><section class="login-panel"><div class="eyebrow">KÍCH HOẠT TÀI KHOẢN</div><h1>Đặt mật khẩu riêng</h1><p>Liên kết này chỉ dùng một lần. Hãy tạo mật khẩu mới để đăng nhập khu vực cán bộ.</p><form id="activate-form"><label for="password">Mật khẩu mới</label><div class="password-field"><input id="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" required placeholder="Tối thiểu 10 ký tự"><button type="button" id="toggle-password" aria-controls="password" aria-label="Hiện mật khẩu">Hiện</button></div><label for="password-confirm">Nhập lại mật khẩu</label><input id="password-confirm" type="password" minlength="10" maxlength="200" autocomplete="new-password" required placeholder="Nhập lại mật khẩu"><div id="activate-error" class="error-text" role="alert"></div><div id="activate-success" class="success-text" role="status" hidden></div><button type="submit" id="activate-submit" class="primary">Lưu mật khẩu →</button></form></section></main><footer class="page-footer"><span>EDU-12 · Kích hoạt cán bộ</span><span>HUST 2026</span></footer></body></html>
