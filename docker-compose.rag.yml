services:
  rag-db:
    image: pgvector/pgvector:0.8.7-pg17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: admissions_rag
      POSTGRES_USER: admissions_rag
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:?Set RAG_POSTGRES_PASSWORD in .env}
    volumes:
      - rag-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admissions_rag -d admissions_rag"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  rag-postgres:
